#cloud-config
# =============================================================================
# Lubuntu 26.04 LTS — Autoinstall unattended
# Base installer: Ubuntu 26.04 live-server, desktop installato al primo boot
# Target VM: lubuntu26.04 / lubuntu26
# =============================================================================
autoinstall:
  version: 1

  locale: it_IT.UTF-8
  keyboard:
    layout: it
    variant: ''

  identity:
    hostname: lubuntu26
    realname: __VM_REALNAME__
    username: __VM_USER__
    # Hash generato con: openssl passwd -6 "${VM_PASS}"
    password: '__VM_PASS_HASH__'

  network:
    network:
      version: 2
      ethernets:
        any:
          match:
            name: 'en*'
          dhcp4: true

  storage:
    layout:
      name: lvm
      match:
        size: largest

  ssh:
    install-server: false

  # NB: lubuntu-desktop NON e' qui: su 26.04 l'unpack del desktop nell'installer
  # (overlayfs della live ISO) va in kernel oops. Viene installato al primo boot
  # sul sistema reale (ext4) dal servizio lab-desktop (vedi late-commands).
  packages:
    - qemu-guest-agent
    - spice-vdagent
    - openvpn
    - network-manager-openvpn
    - network-manager-openvpn-gnome
    - bind9-dnsutils
    - aspell
    - aspell-it
    - linux-generic-hwe-26.04

  late-commands:
    - curtin in-target -- mkdir -p /etc/sddm.conf.d
    - curtin in-target -- bash -c 'printf "[Autologin]\nUser=__VM_USER__\nSession=Lubuntu\n" > /etc/sddm.conf.d/autologin.conf'
    # Desktop installato al PRIMO BOOT sul sistema reale (ext4), non nell'installer
    # (su 26.04 l'unpack del desktop in overlayfs della live ISO va in kernel oops).
    - curtin in-target -- bash -c 'printf "#!/bin/sh\nexec >>/var/log/lab-desktop.log 2>&1\nset -ex\nexport DEBIAN_FRONTEND=noninteractive\nprintf \"#!/bin/sh\\nexit 101\\n\" > /usr/sbin/policy-rc.d\nchmod +x /usr/sbin/policy-rc.d\ntrap \"rm -f /usr/sbin/policy-rc.d\" EXIT\napt-get update\napt-get install -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold lubuntu-desktop plymouth-theme-lubuntu-logo\nrm -f /usr/sbin/policy-rc.d\ntrap - EXIT\nsystemctl set-default graphical.target\nsystemctl enable sddm\nif [ -f /usr/share/plymouth/themes/lubuntu-logo/lubuntu-logo.plymouth ] && update-alternatives --query default.plymouth >/dev/null 2>&1; then update-alternatives --set default.plymouth /usr/share/plymouth/themes/lubuntu-logo/lubuntu-logo.plymouth; update-initramfs -u; fi\nsystemctl disable lab-desktop.service\nsystemctl reboot\n" > /usr/local/sbin/lab-desktop.sh; chmod +x /usr/local/sbin/lab-desktop.sh'
    - curtin in-target -- bash -c 'printf "[Unit]\nDescription=Lab desktop first boot install\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nType=oneshot\nExecStart=/usr/local/sbin/lab-desktop.sh\nRemainAfterExit=yes\nTimeoutStartSec=0\n\n[Install]\nWantedBy=multi-user.target\n" > /etc/systemd/system/lab-desktop.service; systemctl enable lab-desktop.service'
    - curtin in-target -- bash -c 'sed -i "s/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"/" /etc/default/grub && update-grub'
    - curtin in-target -- systemctl enable qemu-guest-agent
    - curtin in-target -- systemctl enable spice-vdagent
    - curtin in-target -- mkdir -p /mnt/shared
    - curtin in-target -- bash -c 'printf "host_shared\t/mnt/shared\tvirtiofs\tnofail,x-systemd.automount,x-systemd.idle-timeout=60\t0\t0\n" >> /etc/fstab'
    - curtin in-target -- mkdir -p /etc/skel/Scrivania /etc/skel/Desktop
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/shared
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/Scrivania/shared
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/Desktop/shared
    - curtin in-target -- bash -c 'if [ -d /home/__VM_USER__ ]; then mkdir -p /home/__VM_USER__/Scrivania /home/__VM_USER__/Desktop; chown -R __VM_USER__:__VM_USER__ /home/__VM_USER__/Scrivania /home/__VM_USER__/Desktop; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/shared; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/Scrivania/shared; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/Desktop/shared; fi'

  shutdown: poweroff
