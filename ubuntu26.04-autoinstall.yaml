#cloud-config
# =============================================================================
# Ubuntu 26.04 LTS — Autoinstall unattended
# Target VM: ubuntu26.04
# Replica: GNOME, openvpn, virtiofs shared, HWE kernel
# =============================================================================
autoinstall:
  version: 1

  # --- Localizzazione ---------------------------------------------------------
  locale: it_IT.UTF-8
  keyboard:
    layout: it
    variant: ''

  # --- Identità ---------------------------------------------------------------
  identity:
    hostname: ubuntu26
    realname: __VM_REALNAME__
    username: __VM_USER__
    # Hash generato con: openssl passwd -6 "${VM_PASS}"
    password: '__VM_PASS_HASH__'

  # --- Rete (DHCP automatico) -------------------------------------------------
  network:
    network:
      version: 2
      ethernets:
        any:
          match:
            name: 'en*'
          dhcp4: true

  # --- Storage (LVM su disco più grande) -------------------------------------
  storage:
    layout:
      name: lvm
      match:
        size: largest

  # --- SSH (non necessario per VM desktop) ------------------------------------
  ssh:
    install-server: false

  # --- Pacchetti aggiuntivi ---------------------------------------------------
  # GNOME Desktop è incluso nell'ISO desktop; qui solo i pacchetti extra
  packages:
    - openvpn
    - network-manager-openvpn
    - network-manager-openvpn-gnome
    - plymouth-theme-spinner
    - spice-vdagent
    - qemu-guest-agent
    - bind9-dnsutils
    - aspell
    - aspell-en
    - linux-generic-hwe-26.04

  # --- Comandi post-installazione ---------------------------------------------
  late-commands:
    - curtin in-target -- systemctl enable qemu-guest-agent
    - curtin in-target -- systemctl enable spice-vdagent
    - curtin in-target -- mkdir -p /etc/gdm3
    - curtin in-target -- bash -c 'printf "[daemon]\nAutomaticLoginEnable=True\nAutomaticLogin=__VM_USER__\n" > /etc/gdm3/custom.conf'
    - curtin in-target -- bash -c 'systemctl enable gdm3 || true'
    - curtin in-target -- bash -c 'if [ -f /usr/share/plymouth/themes/spinner/spinner.plymouth ]; then update-alternatives --set default.plymouth /usr/share/plymouth/themes/spinner/spinner.plymouth; update-initramfs -u; fi'
    - curtin in-target -- bash -c 'sed -i "s/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"/" /etc/default/grub && update-grub'
    - curtin in-target -- mkdir -p /mnt/shared
    - curtin in-target -- bash -c 'printf "host_shared\t/mnt/shared\tvirtiofs\tnofail,x-systemd.automount,x-systemd.idle-timeout=60\t0\t0\n" >> /etc/fstab'
    # Ubuntu Desktop crea l'utente dopo queste late-commands: usa /etc/skel.
    # Non rimuovere gnome-initial-setup qui: ubuntu-desktop-bootstrap lo tratta
    # come errore durante la sessione live.
    - curtin in-target -- mkdir -p /etc/skel/.config/gtk-3.0 /etc/skel/Scrivania /etc/skel/Desktop
    - curtin in-target -- touch /etc/skel/.config/gnome-initial-setup-done
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/shared
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/Scrivania/shared
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/Desktop/shared
    - curtin in-target -- bash -c 'printf "file:///mnt/shared shared\n" >> /etc/skel/.config/gtk-3.0/bookmarks'
    - curtin in-target -- bash -c 'if [ -d /home/__VM_USER__ ]; then mkdir -p /home/__VM_USER__/.config/gtk-3.0 /home/__VM_USER__/Scrivania /home/__VM_USER__/Desktop; chown -R __VM_USER__:__VM_USER__ /home/__VM_USER__/.config /home/__VM_USER__/Scrivania /home/__VM_USER__/Desktop; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/shared; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/Scrivania/shared; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/Desktop/shared; grep -qxF "file:///mnt/shared shared" /home/__VM_USER__/.config/gtk-3.0/bookmarks 2>/dev/null || printf "file:///mnt/shared shared\n" >> /home/__VM_USER__/.config/gtk-3.0/bookmarks; chown -R __VM_USER__:__VM_USER__ /home/__VM_USER__/.config; fi'

  # Spegni invece di riavviare (virt-install usa --noreboot)
  shutdown: poweroff
