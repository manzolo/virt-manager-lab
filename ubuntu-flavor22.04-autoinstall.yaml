#cloud-config
# =============================================================================
# Ubuntu flavor 22.04 LTS (Jammy) — Autoinstall unattended
# Base installer: Ubuntu 22.04 live-server + pacchetto desktop del flavor
# Template usato da scripts/install-ubuntu-flavor22.04.sh
# =============================================================================
autoinstall:
  version: 1

  locale: it_IT.UTF-8
  keyboard:
    layout: it
    variant: ''

  identity:
    hostname: __FLAVOR_HOSTNAME__
    realname: __VM_REALNAME__
    username: __VM_USER__
    # Hash generato con: openssl passwd -6 "${VM_PASS}"
    password: '__VM_PASS_HASH__'

  network:
    network:
      version: 2
      ethernets:
        any:
          match:
            name: 'en*'
          dhcp4: true

  storage:
    layout:
      name: lvm
      match:
        size: largest

  ssh:
    install-server: false

  packages: []

  late-commands:
    - curtin in-target -- bash -c "sed -i 's|main restricted$|main restricted universe multiverse|g' /etc/apt/sources.list"
    - curtin in-target -- apt-get update
    - curtin in-target -- env DEBIAN_FRONTEND=noninteractive apt-get install -y __DESKTOP_PACKAGE__ __PLYMOUTH_PACKAGE__ qemu-guest-agent spice-vdagent openvpn network-manager-openvpn network-manager-openvpn-gnome bind9-dnsutils aspell aspell-it linux-generic-hwe-22.04
    - curtin in-target -- systemctl set-default graphical.target
    - curtin in-target -- mkdir -p /etc/sddm.conf.d /etc/lightdm/lightdm.conf.d
    - curtin in-target -- bash -c 'printf "[Autologin]\nUser=__VM_USER__\nSession=__SDDM_SESSION__\n" > /etc/sddm.conf.d/autologin.conf'
    - curtin in-target -- bash -c 'printf "[Seat:*]\nautologin-user=__VM_USER__\nautologin-user-timeout=0\n" > /etc/lightdm/lightdm.conf.d/50-autologin.conf'
    - curtin in-target -- bash -c 'systemctl enable __DISPLAY_MANAGER__ || true'
    - curtin in-target -- bash -c 'if [ -n "__PLYMOUTH_THEME_PATH__" ] && [ -f "__PLYMOUTH_THEME_PATH__" ]; then update-alternatives --set default.plymouth "__PLYMOUTH_THEME_PATH__"; update-initramfs -u; fi'
    - curtin in-target -- bash -c 'sed -i "s/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"/" /etc/default/grub && update-grub'
    - curtin in-target -- systemctl enable qemu-guest-agent
    - curtin in-target -- systemctl enable spice-vdagent
    - curtin in-target -- mkdir -p /mnt/shared
    - curtin in-target -- bash -c 'printf "host_shared\t/mnt/shared\tvirtiofs\tnofail,x-systemd.automount,x-systemd.idle-timeout=60\t0\t0\n" >> /etc/fstab'
    - curtin in-target -- mkdir -p /etc/skel/Scrivania /etc/skel/Desktop
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/shared
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/Scrivania/shared
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/Desktop/shared
    - curtin in-target -- bash -c 'if [ -d /home/__VM_USER__ ]; then mkdir -p /home/__VM_USER__/Scrivania /home/__VM_USER__/Desktop; chown -R __VM_USER__:__VM_USER__ /home/__VM_USER__/Scrivania /home/__VM_USER__/Desktop; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/shared; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/Scrivania/shared; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/Desktop/shared; fi'

  shutdown: poweroff
