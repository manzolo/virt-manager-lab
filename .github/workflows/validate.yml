name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xorriso python3-yaml python3-bcrypt libxml2-utils

      - name: Network lab configuration and safety checks
        run: python3 -m unittest discover -s tests -p 'test_network_lab.py'

      # Il registro vms.tsv e' l'unica fonte di verita' dell'inventario VM:
      # verifica id/nomi VM univoci, script esistenti, campi validi.
      - name: VM registry
        run: bash scripts/vms-registry.sh --check

      # Il Makefile genera i propri target dal registro: se il parsing si rompe
      # spariscono tutti i target, quindi lo si esercita esplicitamente.
      - name: Makefile targets from registry
        run: |
          make help
          make list
          for id in $(bash scripts/vms-registry.sh --ids); do
            make -n "install-$id" >/dev/null || { echo "target install-$id KO"; exit 1; }
          done
          echo "target generati OK per $(bash scripts/vms-registry.sh --ids | wc -l) VM"

      # Gli item dei test e2e sono derivati dal registro: verifica che gli env
      # si sourcino e producano le liste attese.
      - name: Test env from registry
        run: |
          set -uo pipefail
          source scripts/test-linux.env
          source scripts/test-win.env
          echo "linux: ${#TEST_ITEMS[@]}, windows: ${#TEST_WIN_ITEMS[@]}"
          [ "${#TEST_ITEMS[@]}" -gt 0 ] && [ "${#TEST_WIN_ITEMS[@]}" -gt 0 ]
        shell: bash

      # Sintassi di TUTTI gli script del registro, non di una lista hardcoded.
      - name: Shell syntax
        run: |
          for s in $(awk -F'\t' '$1 ~ /^[a-z0-9]/ {print $3}' vms.tsv) \
                   scripts/install-ubuntu-flavor.sh \
                   scripts/install-enterprise-linux.sh \
                   scripts/lib/subiquity-install.sh \
                   scripts/vms-registry.sh \
                   scripts/test-lib.sh scripts/test-all.sh \
                   scripts/test-linux.sh scripts/test-win.sh \
                   scripts/clean-vm.sh scripts/setup.sh; do
            bash -n "$s" || { echo "syntax KO: $s"; exit 1; }
          done
          echo "shell syntax OK"

      # I file con un placeholder da solo su una riga (es. __INSTALLER_PACKAGES__)
      # sono template che diventano YAML valido solo dopo la sostituzione:
      # si saltano esplicitamente invece di far fallire il job.
      - name: YAML autoinstall syntax
        run: |
          for f in unattended/*-autoinstall.yaml; do
            if grep -q '^__[A-Z_]*__$' "$f"; then
              echo "$f SKIP (template, valido solo dopo il rendering)"
              continue
            fi
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              && echo "$f OK"
          done

      - name: XML syntax (autounattend / autoyast)
        run: |
          for f in scripts/win*/autounattend.xml unattended/tumbleweed-autoyast.xml; do
            xmllint --noout "$f" && echo "$f OK"
          done

      - name: Required files present
        run: |
          test -f vms.tsv                             && echo "vms.tsv OK"
          test -f unattended/Debian13-preseed.cfg     && echo "Debian13-preseed.cfg OK"
          test -f unattended/enterprise-linux.ks      && echo "enterprise-linux.ks OK"
          test -f unattended/fedora-silverblue.ks     && echo "fedora-silverblue.ks OK"
          test -f unattended/ubuntu-flavor-autoinstall.yaml && echo "ubuntu-flavor-autoinstall.yaml OK"
          test -f scripts/lib/subiquity-install.sh    && echo "subiquity-install.sh OK"
          test -f scripts/win11/autounattend.xml      && echo "autounattend.xml OK"
