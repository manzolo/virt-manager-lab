#cloud-config
# =============================================================================
# Lubuntu 22.04 LTS (Jammy) — Autoinstall unattended
# Base installer: Ubuntu 22.04 live-server + pacchetto lubuntu-desktop
# Target VM: lubuntu22.04 / lubuntu22
# =============================================================================
autoinstall:
  version: 1

  locale: it_IT.UTF-8
  keyboard:
    layout: it
    variant: ''

  identity:
    hostname: lubuntu22
    realname: __VM_REALNAME__
    username: __VM_USER__
    # Hash generato con: openssl passwd -6 "${VM_PASS}"
    password: '__VM_PASS_HASH__'

  network:
    network:
      version: 2
      ethernets:
        any:
          match:
            name: 'en*'
          dhcp4: true

  storage:
    layout:
      name: lvm
      match:
        size: largest

  ssh:
    install-server: false

  packages:
    - lubuntu-desktop
    - plymouth-theme-lubuntu-logo
    - qemu-guest-agent
    - spice-vdagent
    - openvpn
    - network-manager-openvpn
    - network-manager-openvpn-gnome
    - bind9-dnsutils
    - aspell
    - aspell-it
    - linux-generic-hwe-22.04

  late-commands:
    - curtin in-target -- systemctl set-default graphical.target
    - curtin in-target -- mkdir -p /etc/sddm.conf.d
    - curtin in-target -- bash -c 'printf "[Autologin]\nUser=__VM_USER__\nSession=Lubuntu\n" > /etc/sddm.conf.d/autologin.conf'
    - curtin in-target -- systemctl enable sddm
    - curtin in-target -- bash -c 'if [ -f /usr/share/plymouth/themes/lubuntu-logo/lubuntu-logo.plymouth ]; then update-alternatives --set default.plymouth /usr/share/plymouth/themes/lubuntu-logo/lubuntu-logo.plymouth; update-initramfs -u; fi'
    - curtin in-target -- bash -c 'sed -i "s/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"/" /etc/default/grub && update-grub'
    - curtin in-target -- systemctl enable qemu-guest-agent
    - curtin in-target -- systemctl enable spice-vdagent
    - curtin in-target -- mkdir -p /mnt/shared
    - curtin in-target -- bash -c 'printf "host_shared\t/mnt/shared\tvirtiofs\tnofail,x-systemd.automount,x-systemd.idle-timeout=60\t0\t0\n" >> /etc/fstab'
    - curtin in-target -- mkdir -p /etc/skel/Scrivania /etc/skel/Desktop
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/shared
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/Scrivania/shared
    - curtin in-target -- ln -sfn /mnt/shared /etc/skel/Desktop/shared
    - curtin in-target -- bash -c 'if [ -d /home/__VM_USER__ ]; then mkdir -p /home/__VM_USER__/Scrivania /home/__VM_USER__/Desktop; chown -R __VM_USER__:__VM_USER__ /home/__VM_USER__/Scrivania /home/__VM_USER__/Desktop; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/shared; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/Scrivania/shared; runuser -u __VM_USER__ -- ln -sfn /mnt/shared /home/__VM_USER__/Desktop/shared; fi'

  shutdown: poweroff
