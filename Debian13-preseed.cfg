# =============================================================================
# Debian 13 (Trixie) — Preseed unattended
# Target VM: Debian13 / ManzoloDebian
# Strategia: sistema base dal DVD, tutto il resto via rete in late_command
# =============================================================================

# --- Localizzazione -----------------------------------------------------------
d-i debian-installer/locale string it_IT.UTF-8
d-i localechooser/supported-locales multiselect it_IT.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select it
d-i keyboard-configuration/layoutcode string it

# --- Rete ---------------------------------------------------------------------
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ManzoloDebian
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

# --- Mirror (solo per il late_command, non per pkgsel) -----------------------
d-i mirror/country string IT
d-i mirror/http/mirror string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Orologio -----------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Rome
d-i clock-setup/ntp boolean true

# --- Partizionamento (UEFI + LVM su /dev/vda) ---------------------------------
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean false

# --- Utente -------------------------------------------------------------------
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Manzolo
d-i passwd/username string manzolo
d-i passwd/user-password-crypted password $6$xAz1OOYvRK3.5IdZ$sgTB7qeJUZ7QG62n2AGN146CRBfwwAeWMYHdLZk/sZYSvWub.APwbCwMfSnbteh7/78mWFWzHFoxEZgwV/T/H/
d-i user-setup/allow-password-weak boolean true
d-i passwd/user-default-groups string sudo audio video cdrom plugdev netdev docker

# --- Selezione pacchetti ------------------------------------------------------
# Solo "standard" dal DVD — stabile e senza dipendenze di rete
tasksel tasksel/first multiselect standard
d-i pkgsel/include string
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# --- Bootloader (grub UEFI) ---------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/vda

# --- Post-installazione -------------------------------------------------------
# Nota: i \n nel preseed sono letterali, quindi si usano echo separati
# Ogni in-target è un comando distinto separato da " ; "
d-i preseed/late_command string \
  in-target bash -c 'echo "deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware" > /etc/apt/sources.list' ; \
  in-target bash -c 'echo "deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware" >> /etc/apt/sources.list' ; \
  in-target bash -c 'echo "deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware" >> /etc/apt/sources.list' ; \
  in-target apt-get update -qq ; \
  in-target bash -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y gnome gdm3 apache2 build-essential binutils cpp gcc bind9-dnsutils aspell-it spice-vdagent qemu-guest-agent curl wget git ca-certificates gnupg' ; \
  in-target bash -c 'install -m 0755 -d /etc/apt/keyrings' ; \
  in-target bash -c 'curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc' ; \
  in-target bash -c 'chmod a+r /etc/apt/keyrings/docker.asc' ; \
  in-target bash -c 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian trixie stable" > /etc/apt/sources.list.d/docker.list' ; \
  in-target bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y containerd.io docker-ce docker-ce-cli docker-buildx-plugin docker-compose-plugin' ; \
  in-target bash -c 'systemctl enable docker && usermod -aG docker manzolo' ; \
  in-target bash -c 'systemctl enable qemu-guest-agent apache2 gdm3'

# --- Fine ---------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
